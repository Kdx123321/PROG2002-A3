<!-- ==========================================================================
     app.html - ROOT LAYOUT (shared by every admin page)
     --------------------------------------------------------------------------
     Segment breakdown (assessment requirement):
       [1] Header  - site logo + Nav, rendered ONCE here, common to all pages
       [2] Nav     - admin navigation links (inside the header)
       [3] Body    - swaps per route through <router-outlet>
       [4] Footer  - rendered ONCE here, common to all pages
     ========================================================================== -->

<!-- ============================ [1]+[2] Header & Nav ============================ -->
<header class="site-nav">
  <div class="container nav-inner">
    <a class="logo" routerLink="/">Events Admin</a>
    <nav>
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">All events</a>
      <a routerLink="/new" routerLinkActive="active">New event</a>
    </nav>
  </div>
</header>

<!-- ================================ [3] Body ================================== -->
<main class="container">
  <router-outlet></router-outlet>
</main>
